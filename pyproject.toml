[project]
name = "creatorflow"
version = "0.1.0"
description = "Media processing and publishing preparation platform for content creators"
readme = "README.md"
authors = [
    { name = "SAMSONOVprodby", email = "0den4ikys0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",
    "E7", 
    "E9",
    "F",
    "I",
    "B", 
    "UP"
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"

files = ["src", "tests"]

plugins = ["pydantic.mypy"]

strict = true

warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "9.0"

testpaths = ["tests"]

python_files = ["test_*.py"]

addopts = [
    "-ra",
    "--strict-markers"
]

[tool.coverage.run]
source = ["creatorflow"]
